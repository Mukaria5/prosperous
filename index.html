<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="description" content="Prosperous Mukaria — independent digital product studio." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prosperous Mukaria — Digital Studio" />
    <meta property="og:description" content="Thoughtful websites, digital products, and AI-powered experiences by Prosperous Mukaria." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prosperous Mukaria — Digital Studio" />
    <meta name="twitter:description" content="Thoughtful websites, digital products, and AI-powered experiences by Prosperous Mukaria." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('pm-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#F5F4F0' : '#0A0A0B');
        } catch {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0A0A0B');
        }
      })();
    </script>
    <title>Prosperous Mukaria — Digital Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
